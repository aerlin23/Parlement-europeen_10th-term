<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10141c">
<title>Présidences du Conseil de l’UE · Mode cinéma</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#10141c;color:#f2f6fd;font-family:Inter,system-ui,-apple-system,Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100svh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#171e2b}
header a{color:#d5e4fc;text-decoration:none;font-size:13px}
header strong{font-size:12px;font-weight:750}
main{display:flex;flex-direction:column;justify-content:center;align-items:center;flex:1;min-height:0;padding:10px}
img{display:block;width:100%;height:auto;max-width:min(100%,177.78vh);max-height:calc(100svh - 132px);object-fit:contain;border-radius:5px;background:#fff}
.actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:10px}
button{border:1px solid #7188b4;border-radius:8px;background:#294d8c;color:white;font:650 13px Inter,system-ui,sans-serif;padding:10px 15px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #ffcc00;outline-offset:3px}
.hint{font-size:12px;color:#a6b9d8;text-align:center;margin:0 10px 12px;line-height:1.5}
:fullscreen{background:#000}
:fullscreen header,:fullscreen .actions,:fullscreen .hint{display:none}
:fullscreen main{padding:0}
:fullscreen img{max-width:100vw;max-height:100vh;border-radius:0}
@media (orientation:landscape){header{padding:7px 12px}main{padding:3px}.hint{display:none}img{max-height:calc(100svh - 100px)}}
</style>
</head>
<body>
<header><a href="./institutions-agences.html">← Institutions &amp; organes</a><strong>Conseil de l’Union européenne · 2026–2030</strong></header>
<main id="viewer"><img src="./assets/presidences-conseil-ue-cinema.avif" width="900" height="507" alt="Infographie approuvée des présidences semestrielles du Conseil de l’Union européenne de 2018 à 2030, avec les drapeaux de chaque État membre."></main>
<div class="actions"><button id="cinema" type="button">Agrandir en plein écran</button></div>
<p class="hint" id="hint">Tourne ton téléphone à l’horizontale pour lire l’infographie plus facilement.</p>
<script>
document.getElementById('cinema').addEventListener('click',async()=>{
 const viewer=document.getElementById('viewer'),hint=document.getElementById('hint');
 try{
  if(!document.fullscreenElement&&viewer.requestFullscreen)await viewer.requestFullscreen();
  else if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();
  if(document.fullscreenElement&&screen.orientation?.lock){try{await screen.orientation.lock('landscape')}catch{}}
  document.getElementById('cinema').textContent=document.fullscreenElement?'Quitter le plein écran':'Agrandir en plein écran';
 }catch{hint.textContent='Le plein écran est indisponible dans ce navigateur. Tourne le téléphone horizontalement et agrandis l’image si nécessaire.'}
});
document.addEventListener('fullscreenchange',()=>{document.getElementById('cinema').textContent=document.fullscreenElement?'Quitter le plein écran':'Agrandir en plein écran'});
</script>
</body></html>
