<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacts — Vademecum PE</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#18314c;font:16px system-ui}header{background:#07367d;color:white;padding:18px;text-align:center}header a{color:white;float:left}main{max-width:720px;margin:auto;padding:12px}input,button{font:inherit;padding:10px;border:1px solid #bccde0;border-radius:8px}input[type=search]{width:100%}nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}button{background:#dce8f6;color:#163c67;cursor:pointer}button.active{background:#07367d;color:white}article{display:flex;justify-content:space-between;gap:12px;padding:12px;background:white;border-radius:9px;margin:7px 0}article.priority{border-left:5px solid #07367d;background:#e2edff}article a{font-weight:bold;color:#07367d;text-decoration:none;font-size:19px}small{display:block}h2{font-size:14px}footer{font-size:12px;text-align:center;margin:20px} @media(prefers-color-scheme:dark){body{background:#111c2c;color:#e5edf8}article{background:#1c2b40}article.priority{background:#203c60}article a{color:#a7caff}}</style><header><a href="./index.html">←</a><strong>VADEMECUM PE</strong><small>Contacts utiles · Projet personnel</small></header><main><h1>Contacts utiles</h1><div id="setup"><p>Importer le fichier personnel de contacts. Les données restent dans ce navigateur et ne sont pas envoyées au serveur.</p><input type="file" id="file" accept=".json,application/json"><p id="status" role="status"></p></div><div id="directory" hidden><input type="search" id="search" placeholder="Nom, service, salle ou numéro…"><nav id="tabs"></nav><nav id="modes"></nav><div id="results"></div><button id="erase">Effacer les données locales</button><button id="replace">Remplacer le fichier</button></div><footer>Source : annuaire CUU · 06/10/2026. Numéros externes non confirmés : non proposés.</footer></main><script>
const $=id=>document.getElementById(id), key='vf-local-contacts-v1';let groups={},tab='Services',mode='Interne';const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s/g,'');
function valid(g){return g&&typeof g==='object'&&!Array.isArray(g)&&Object.keys(g).length>0&&Object.values(g).every(a=>Array.isArray(a)&&a.every(r=>Array.isArray(r)&&r.length>=2&&r.length<=3&&r.every(v=>typeof v==='string')))}
function start(g){groups=g;tab=Object.keys(g)[0];$('directory').hidden=false;$('setup').hidden=true;render()}
function buttons(id,items,active,cb){$(id).replaceChildren(...items.map(t=>{const b=document.createElement('button');b.textContent=t;b.className=t===active?'active':'';b.onclick=()=>{cb(t);render()};return b}))}
function render(){buttons('tabs',Object.keys(groups),tab,v=>tab=v);buttons('modes',['Interne','Externe'],mode,v=>mode=v);const q=norm($('search').value),out=$('results');out.replaceChildren();for(const [g,rows] of Object.entries(groups)){if(!q&&g!==tab)continue;const hits=rows.filter(r=>norm(r.join(' ')).includes(q));if(!hits.length)continue;const h=document.createElement('h2');h.textContent=g;out.append(h);for(const [name,num,ext] of hits){const a=document.createElement('article');if(g==='Services'&&['30300','85600','85112'].includes(num)||name==='Régie')a.className='priority';const title=document.createElement('strong');title.textContent=name;a.append(title);const d=document.createElement('div');const n=mode==='Interne'?num:ext;if(n&&/^[+\d\s/]+$/.test(n)){for(const v of n.split('/')){const link=document.createElement('a');link.href='tel:'+v.replace(/\s/g,'');link.textContent=v.trim();d.append(link,document.createElement('br'))}}else{d.textContent='Non renseigné / confirmé'}a.append(d);out.append(a)}}if(!out.children.length)out.textContent='Aucun résultat.'}
$('file').onchange=async()=>{try{const g=JSON.parse(await $('file').files[0].text());if(!valid(g))throw Error('Format invalide');localStorage.setItem(key,JSON.stringify(g));start(g)}catch(e){$('status').textContent='Import impossible : '+e.message}};
$('search').oninput=render;$('erase').onclick=()=>{if(confirm('Effacer les contacts de cet appareil ?')){localStorage.removeItem(key);location.reload()}};$('replace').onclick=()=>{$('setup').hidden=false};try{const g=JSON.parse(localStorage.getItem(key)||'null');if(valid(g))start(g)}catch(e){}</script></html>
