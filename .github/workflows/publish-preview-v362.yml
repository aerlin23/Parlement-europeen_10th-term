name: Publish isolated Vademecum v362 preview
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-preview-v362.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Copy the development tree to an isolated subfolder
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin consolidation-v2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --cached --ignore-unmatch preview-v362
          rm -rf preview-v362
          git read-tree --prefix=preview-v362/ origin/consolidation-v2
          git diff --cached --quiet && { echo "Preview already current"; exit 0; }
          git commit -m 'Publish isolated v362 preview without changing production files'
          git push origin HEAD:main
      - name: Check staging files in the published tree
        run: |
          git ls-tree -r --name-only HEAD | grep -q '^preview-v362/home.html$'
          git ls-tree -r --name-only HEAD | grep -q '^preview-v362/sw.js$'
          git ls-tree -r --name-only HEAD | grep -q '^preview-v362/members.json$'
