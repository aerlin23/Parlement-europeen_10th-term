name: Import official hemicycle seats
on:
  push:
    paths:
      - scripts/update_hemicycle_from_pdf.py
      - .github/workflows/update-hemicycle.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-seats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --quiet pymupdf Pillow
      - name: Import the verified November 2026 PDFs
        env:
          OMP_THREAD_LIMIT: '1'
        run: python scripts/update_hemicycle_from_pdf.py
      - name: Commit only verified seat updates
        run: |
          if ! git diff --quiet -- hemicycle-seats.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hemicycle-seats.json
            git commit -m "Mettre à jour les places Bruxelles 11/11 et Strasbourg 19/10"
            git push
          fi
