name: Contrôles qualité du trombinoscope
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôler le code JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          found=re.search(r'<script>(.*?)</script>',html,re.DOTALL)
          assert found, "Script principal manquant"
          Path('/tmp/trombinoscope-main.js').write_text(found.group(1),encoding='utf-8')
          PY
          node --check /tmp/trombinoscope-main.js
          node --check sw.js
      - name: Vérifier les fichiers, données et règles métier
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Installer Playwright et Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Tester annuaire et quiz dans un navigateur mobile
        run: python tests/browser_smoke.py
