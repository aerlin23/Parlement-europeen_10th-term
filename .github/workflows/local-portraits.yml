name: Sauvegarder les portraits pour iPhone
on:
  workflow_dispatch:
  schedule:
    # Vérifier et compléter les portraits chaque deuxième jour du mois.
    - cron: "20 4 2 * *"
  push:
    paths:
      - ".github/workflows/local-portraits.yml"
      - "members.json"
permissions:
  contents: write
  issues: write
concurrency:
  group: local-portraits
  cancel-in-progress: false
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils d'image
        run: python -m pip install --quiet requests pillow
      - name: Télécharger les portraits officiels dans le site
        run: |
          python - <<'PY'
          import json,io,time,random
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from PIL import Image,ImageOps
          import requests
          members=json.loads(Path("members.json").read_text(encoding="utf-8"))
          folder=Path("photos");folder.mkdir(exist_ok=True)
          ids=sorted({str(m["id"]) for m in members})
          def download(mid):
              path=folder/(mid+".jpg")
              if path.exists() and path.stat().st_size>2500:
                  return True
              for attempt in range(4):
                  try:
                      response=requests.get("https://www.europarl.europa.eu/mepphoto/"+mid+".jpg",
                          timeout=25,headers={"User-Agent":"Mozilla/5.0 (compatible; TrombinoscopePE/1.0)"})
                      response.raise_for_status()
                      if not response.headers.get("Content-Type","").lower().startswith("image/"):
                          raise ValueError("Réponse non-image")
                      im=Image.open(io.BytesIO(response.content))
                      im=ImageOps.exif_transpose(im).convert("RGB")
                      im.thumbnail((480,600),Image.Resampling.LANCZOS)
                      im.save(path,"JPEG",quality=80,optimize=True)
                      return True
                  except Exception as exc:
                      if attempt==3:
                          print("Échec",mid,repr(exc))
                      else:
                          time.sleep(0.5*(attempt+1)+random.random())
              return False
          with ThreadPoolExecutor(max_workers=6) as executor:
              result=list(executor.map(download,ids))
          print("Téléchargés:",sum(result),"/",len(ids))
          if sum(result)<int(len(ids)*.9):
              raise SystemExit("Moins de 90 % des portraits ont été téléchargés : vérifier le serveur source")
          PY
      - name: Générer les miniatures WebP optimisées pour l'annuaire
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageOps
          members=json.loads(Path("members.json").read_text(encoding="utf-8"))
          folder=Path("thumbs")
          folder.mkdir(exist_ok=True)
          created=0
          for mid in sorted({str(m["id"]) for m in members}):
              source=Path("photos")/(mid+".jpg")
              target=folder/(mid+".webp")
              if not source.exists():
                  continue
              if target.exists() and target.stat().st_mtime >= source.stat().st_mtime:
                  continue
              with Image.open(source) as picture:
                  picture=ImageOps.exif_transpose(picture).convert("RGB")
                  picture.thumbnail((220,280),Image.Resampling.LANCZOS)
                  picture.save(target,"WEBP",quality=74,method=5)
              created+=1
          print("Miniatures WebP créées ou actualisées:",created)
          PY
      - name: Générer l'inventaire fiable des portraits disponibles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          members=json.loads(Path("members.json").read_text(encoding="utf-8"))
          ids={str(m["id"]) for m in members}
          manifest={
            "photos":sorted(i for i in ids if (Path("photos")/(i+".jpg")).is_file()),
            "thumbs":sorted(i for i in ids if (Path("thumbs")/(i+".webp")).is_file())
          }
          Path("photo-assets.json").write_text(json.dumps(manifest,separators=(",",":"))+"\n",encoding="utf-8")
          print("Inventaire :",len(manifest["photos"]),"photos,",len(manifest["thumbs"]),"miniatures")
          PY
      - name: Publier les portraits sur GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/ thumbs/ photo-assets.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les portraits et miniatures WebP du trombinoscope"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Signaler une erreur de téléchargement sans doublon
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Portraits non actualisés : contrôle nécessaire"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // ""')
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "La génération ou la publication des portraits et miniatures a échoué. Vérifier : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
