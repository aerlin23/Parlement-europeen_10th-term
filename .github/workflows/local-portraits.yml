name: Sauvegarder les portraits pour iPhone
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/local-portraits.yml"
permissions:
  contents: write
concurrency:
  group: local-portraits
  cancel-in-progress: false
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils d'image
        run: python -m pip install --quiet requests pillow
      - name: Télécharger les portraits officiels dans le site
        run: |
          python - <<'PY'
          import json,io,time,random
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from PIL import Image,ImageOps
          import requests
          members=json.loads(Path("members.json").read_text(encoding="utf-8"))
          folder=Path("photos");folder.mkdir(exist_ok=True)
          ids=sorted({str(m["id"]) for m in members})
          def download(mid):
              path=folder/(mid+".jpg")
              if path.exists() and path.stat().st_size>2500:
                  return True
              for attempt in range(4):
                  try:
                      response=requests.get("https://www.europarl.europa.eu/mepphoto/"+mid+".jpg",
                          timeout=25,headers={"User-Agent":"Mozilla/5.0 (compatible; TrombinoscopePE/1.0)"})
                      response.raise_for_status()
                      if not response.headers.get("Content-Type","").lower().startswith("image/"):
                          raise ValueError("Réponse non-image")
                      im=Image.open(io.BytesIO(response.content))
                      im=ImageOps.exif_transpose(im).convert("RGB")
                      im.thumbnail((480,600),Image.Resampling.LANCZOS)
                      im.save(path,"JPEG",quality=80,optimize=True)
                      return True
                  except Exception as exc:
                      if attempt==3:
                          print("Échec",mid,repr(exc))
                      else:
                          time.sleep(0.5*(attempt+1)+random.random())
              return False
          with ThreadPoolExecutor(max_workers=6) as executor:
              result=list(executor.map(download,ids))
          print("Téléchargés:",sum(result),"/",len(ids))
          if sum(result)<int(len(ids)*.9):
              raise SystemExit("Moins de 90 % des portraits ont été téléchargés : vérifier le serveur source")
          PY
      - name: Publier les portraits sur GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/
          if ! git diff --cached --quiet; then
            git commit -m "Héberger les portraits localement pour iPhone et PWA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
