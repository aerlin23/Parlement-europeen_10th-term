name: Extraire les places des hémicycles (vérification)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/hemicycle-seats.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Télécharger les deux plans officiels
        shell: bash
        run: |
          set -u
          for site in STR BRU; do
            echo "::group::PLAN_$site"
            curl --location --fail --silent --show-error --max-time 28 --retry 1 -A 'Mozilla/5.0 (compatible; VademecumPE/1.0)' "https://www.europarl.europa.eu/sedcms/pubfile/HEMICYCLE/PLAN_${site}.pdf" -o "PLAN_${site}.pdf" || true
            if [ -f "PLAN_${site}.pdf" ]; then
              ls -lh "PLAN_${site}.pdf"
              file "PLAN_${site}.pdf"
              head -c 12 "PLAN_${site}.pdf" | od -An -tx1
              if head -c 4 "PLAN_${site}.pdf" | grep -q '%PDF'; then
                pdftotext -layout "PLAN_${site}.pdf" "PLAN_${site}.txt"
                echo "EXTRACTED $site: $(wc -l < PLAN_${site}.txt) lines"
                echo "Preview:"
                head -n 8 "PLAN_${site}.txt" | cut -c1-150
              fi
            else
              echo "FAILED to download PLAN_$site"
            fi
            echo "::endgroup::"
          done
