name: Vademecum integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/data-integrity.test.cjs
      - run: node tests/cavaliers-core.test.cjs
      - run: node tests/offline-policy.test.cjs
      - name: Check JavaScript syntax
        run: |
          for f in *.js; do node --check "$f" || exit 1; done
