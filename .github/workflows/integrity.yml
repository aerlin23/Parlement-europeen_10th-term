name: Vademecum integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/data-integrity.test.cjs
      - run: node tests/cavaliers-core.test.cjs
      - run: node tests/private-cavalier-matching.test.cjs
      - run: node tests/mep-cavalier-transposition.test.cjs
      - run: node tests/offline-policy.test.cjs
      - run: node tests/vector-pdf.test.cjs
      - run: node tests/official-roster.test.cjs
      - run: node tests/privacy-release.test.cjs
      - run: node tests/workflow-policy.test.cjs
      - run: node tests/night-contrast.test.cjs
      - name: Check JavaScript syntax
        run: |
          for f in *.js js/*.js scripts/*.cjs tests/*.cjs; do
            [ -f "$f" ] || continue
            node --check "$f" || exit 1
          done
